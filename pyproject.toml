[project]
name = "adept"
version = "0.0.1"
authors = [
  { name="Ben Scott", email="ben@benscott.co.uk" }
]
description = "ADEPT"
readme = "README.md"
requires-python = ">=3.11,<3.12"
classifiers = [
]
dependencies = [
    "beautifulsoup4==4.8.2",
    "datasets==2.9.0",
    "en-ner-eco-biobert",
    "evaluate==0.4.0",
    "html5lib==1.1",
    "jsonlines==3.1.0",
    "jupyterlab>=4.1.6",
    "langdetect==1.0.9",
    "luigi==3.2.0",
    "numpy==1.26.4",
    "openpyxl==3.1.2",
    "pandas==2.2.3",
    "pint==0.20.1",
    "pytesseract==0.3.10",
    "python-dotenv==0.21.0",
    "pyyaml>=6.0.1,<7",
    "ratarmountcore[bzip2]==0.7.2",
    "redis==5.0.5",
    "requests==2.28.1",
    "requests-cache==0.9.7",
    "requests-futures==1.0.0",
    "scipy==1.10.0",
    "spacy==3.7.5",
    "spacy-huggingface-hub==0.0.10",
    "taxonerd==1.5.4",
    "unidecode==1.3.6",
]

[project.urls]
"Homepage" = "https://github.com/benscott/adept"

[project.scripts]
adept = "adept.cli:cli"

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["adept"]  # package names should match these glob patterns (["*"] by default)
exclude = []  # exclude packages matching these glob patterns (empty by default)
namespaces = false 

[tool.uv]
package = true

[tool.uv.sources]
en-ner-eco-biobert = { url = "https://github.com/nleguillarme/taxonerd/releases/download/v1.5.4/en_ner_eco_biobert-1.1.0.tar.gz" }
